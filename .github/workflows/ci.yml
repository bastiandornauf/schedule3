name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: |
          dotnet restore ./api/HPSchedule.Api/HPSchedule.Api.csproj
          dotnet restore ./api/HPSchedule.Api.Tests/HPSchedule.Api.Tests.csproj

      - name: Build
        run: |
          dotnet build --no-restore -c Release ./api/HPSchedule.Api/HPSchedule.Api.csproj
          dotnet build --no-restore -c Release ./api/HPSchedule.Api.Tests/HPSchedule.Api.Tests.csproj

      - name: Test
        run: |
          dotnet test --no-build -c Release ./api/HPSchedule.Api.Tests/HPSchedule.Api.Tests.csproj --collect:"XPlat Code Coverage" --results-directory TestResults
