version: "3.9"
services:
  db:
    image: mariadb:10.11
    environment:
      - MARIADB_ROOT_PASSWORD=dev
      - MARIADB_DATABASE=hpschedule
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build:
      context: ..
      dockerfile: api/HPSchedule.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5080:8080"
    depends_on:
      - db

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "5081:80"
    depends_on:
      - api

volumes:
  db_data:
